name: hollo
description: >-
  Hollo in-app support chat for Flutter apps: a chat screen, an unread badge,
  review, offer and link cards, and push hand-off. Pure Dart, no native code.
version: 0.1.3
homepage: https://hollo.so
repository: https://github.com/karimrashed017/hollo/tree/main/sdks/flutter
# Installed from git until it's on pub.dev.
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
